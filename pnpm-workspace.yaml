packages:
  - 'apps/*'
allowBuilds:
  esbuild: true
  # Optional native accelerator for msgpackr (pulled in transitively by alchemy).
  # The pure-JS path is used instead — no build step needed.
  msgpackr-extract: false
  workerd: true
minimumReleaseAgeExclude:
  - hono@4.13.7
  - '@cloudflare/workers-types@5.20260905.1'
  - shadcn-svelte@1.6.1

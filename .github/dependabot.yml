# Dependency updates twice a month, grouped by family so each PR is one thing to
# review. Majors aren't in any group, so each major arrives as its own PR.
version: 2

updates:
  - package-ecosystem: "npm" # pnpm: one root lockfile covers the workspace
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    versioning-strategy: "increase"
    # Supply-chain safety: never propose a version younger than this. Keep it
    # above pnpm's `minimumReleaseAge` (pnpm-workspace.yaml, 1 day), or pnpm
    # refuses to resolve the version and the update fails.
    cooldown:
      default-days: 3
      semver-major-days: 7
    ignore:
      # Exact prerelease pins that must move together, by hand (ADR-0001).
      - dependency-name: "alchemy"
      - dependency-name: "@alchemy.run/*"
      - dependency-name: "effect"
      - dependency-name: "@effect/*"
      - dependency-name: "drizzle-orm"
      - dependency-name: "drizzle-kit"
    groups:
      cloudflare:
        update-types: ["minor", "patch"]
        patterns: ["wrangler", "@cloudflare/*"]
      api:
        update-types: ["minor", "patch"]
        patterns: ["hono", "@hono/*", "zod", "@libsql/*"]
      dashboard-ui:
        update-types: ["minor", "patch"]
        patterns:
          - "svelte"
          - "@sveltejs/*"
          - "svelte-check"
          - "shadcn-svelte"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
          - "tailwind-variants"
          - "tw-animate-css"
          - "clsx"
          - "@lucide/*"
          - "@fontsource-variable/*"
      tooling:
        update-types: ["minor", "patch"]
        patterns:
          - "typescript"
          - "vite"
          - "vitest"
          - "oxlint"
          - "oxfmt"
          - "@types/node"
          - "husky"
          - "@commitlint/*"
      remaining:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]

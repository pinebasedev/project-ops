name: Bug report
description: Something in the platform doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security issues go through the Security tab, not here. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, Node and pnpm versions, Alchemy version, local (`pnpm dev`) or deployed.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Remove tokens, Access credentials, and account IDs first.
      render: shell
